name: Daily Mining (Low Ticket)
on:
  schedule:
    - cron: '0 8 * * *'  # 8:00 UTC = 5:00 BRT
  workflow_dispatch:

jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily mining run
        run: |
          curl -s -X POST "${{ secrets.API_URL }}/api/mining/daily/run" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" | jq .
